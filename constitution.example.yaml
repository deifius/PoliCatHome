# PolyC@home / PoliC@home — illustrative policy, NOT an implemented enforcement engine.
apiVersion: polic.home/v0alpha1
kind: NodeConstitution
metadata:
  name: my-home-node
  revision: 1
spec:
  # PoliC: Candid Constitutional Consent. Deny execution without valid mutual consent.
  sovereignty:
    local_workloads_first: true
    owner_can_revoke_immediately: true
    pause_on_local_activity: true
    require_mutual_consent: true
  # PolyC: Coordinated Computational Care. All limits require host enforcement.
  nice_plus:
    level: 30 # application policy label, NOT Linux nice(2)
    cpu_percent_max: 30
    gpu_utilization_percent_max: 40 # requires device-specific support
    memory_gib_max: 8
  thermal:
    # Degrees Celsius. Limits are conservative EXAMPLES, not universal safe values.
    gpu_core_c_max: 75
    gpu_hotspot_c_max: 90
    gpu_memory_junction_c_max: 90
    cpu_package_c_max: 80
    system_inlet_c_max: 35
    system_exhaust_c_max: 45
    # Unavailable telemetry => do not start/pause the relevant workload.
    missing_sensor_action: pause
    sensor_stale_after_seconds: 15
    resume_below_limit_by_c: 5 # hysteresis avoids rapid cycling
    exceed_action: pause_then_stop
    # Host daemon must enforce limits; guest VM cannot be trusted to do so.
  energy:
    gpu_power_watts_max: 150
    system_power_watts_max: 350 # requires whole-system meter
    daily_energy_kwh_max: 2
    missing_meter_action: deny # don't claim enforceability without telemetry
  content:
    require_public_repository: true
    require_pinned_source_commit: true
    require_signed_artifacts: true
    require_declared_inputs_outputs: true
    deny_categories:
      - targeted_harassment
      - violent_extremist_propaganda
      - nonconsensual_intimate_content
      - unlawful_surveillance
    allow_categories:
      - climate_research
      - open_science
      - open_media
    unknown_category_action: ask_owner
  ethos:
    # Declarative preferences, NOT automatically verifiable facts about people.
    priorities: [community_benefit, environmental_research, open_knowledge]
    exclude_projects_with_declared_purposes:
      - ethnic_cleansing
      - racial_supremacy
    require_project_constitution: true
    require_contributor_compatibility: true
    unverifiable_claim_action: human_review
    allow_commercial_projects: false
  privacy:
    share_precise_location: false
    publish_device_identity: false
    publish_thermal_telemetry: false
  reporting:
    chronicle_frequency: weekly
    include_policy_decisions: true
    include_energy_and_thermal_measurements: true
    catnap_enabled: true
