# NON-EXECUTABLE EXAMPLE. Replace owner public key with Ed25519 keygen output before signing.
apiVersion: polic.home/v0alpha1
kind: ProjectConstitution
metadata:
  project_id: community-render-demo
  title: Community Animation Rendering
  revision: 1
spec:
  project_owner_pubkey: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
  purpose:
    summary: Produce openly licensed frames for a collectively authored animated short film.
    category: creative_rendering
    declared_uses: [open_animation, artistic_collaboration]
    prohibited_uses: [targeted_harassment, ethnic_cleansing, extremist_propaganda]
    commercial: false
  participation:
    eligible_node_ids: []
    excluded_node_ids: []
    eligible_jurisdictions: [] # empty means no project-side geographic restriction
    require_explicit_mutual_consent: true
    owner_may_revoke: true
    project_may_cancel: true
  distribution:
    mode: credits
    credit_per_verified_task: 1
    revenue_pool_percent: 0
    revenue_basis: null
    preserve_earned_credits_on_cancellation: true
    ledger_visibility: participants
    payout_method: none
    output_license: CC-BY-SA-4.0
  financial_disclosure:
    currency: USD
    sources:
      - stream_id: supporters
        kind: patronage
        provider: patreon
        evidence: provider_statement
        included_in_revenue_share: false
      - stream_id: commission
        kind: sales
        provider: paypal
        evidence: provider_statement
        included_in_revenue_share: false
    receipts_definition: gross_receipts_less_tax_and_refunds
    processor_fees_borne_by: project_owner
    settlement_cadence: monthly
    payout_rails: [paypal_payouts, zelle_manual, bank_transfer_manual]
    minimum_payout_minor_units: 1000
    dispute_window_days: 30
    contribution_terms_immutable: true
    external_custody_only: true
    real_payment_execution: not_implemented
